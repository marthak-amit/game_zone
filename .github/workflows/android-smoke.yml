name: Android smoke test
on:
  workflow_dispatch:
  push:
    paths: ['lib/**', 'android/**', 'pubspec.yaml', '.github/workflows/android-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Launch on emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.amit.sky_stack -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > smoke.png || true
            echo "=== CRASH BUFFER ==="; adb logcat -d -b crash | head -40 || true
            echo "=== FLUTTER LOG ==="; adb logcat -d -s flutter:V | tail -30 || true
            if adb shell pidof com.amit.sky_stack; then echo "SMOKE RESULT: APP RUNNING OK"; else echo "SMOKE RESULT: APP NOT RUNNING"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screenshot, path: smoke.png }
