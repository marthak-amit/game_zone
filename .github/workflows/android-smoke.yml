name: Android smoke test
on:
  workflow_dispatch:
  push:
    paths: ['lib/**', 'android/**', 'pubspec.yaml', 'scripts/**', '.github/workflows/android-smoke.yml']
jobs:
  smoke:
    name: smoke (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        # diagnostic builds that each switch one feature family off (real app = 'full')
        variant: [full, lite]
    env:
      VARIANT: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=VARIANT=${{ matrix.variant }}
      - name: Free memory before starting the emulator
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          free -m
      - name: Launch on emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.variant }}
          path: |
            smoke_*.png
            smoke_logcat.txt
            smoke_host.txt
